name: Refresh public feeds

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch public feeds into the cache
        run: python3 scripts/fetch_feeds.py
      - name: Re-check parsers and the privacy grep
        run: python3 -m unittest discover -s tests -v
      - name: Commit the cache on main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/snapshot.json
          if git diff --staged --quiet; then
            echo "Cache unchanged"
          else
            git commit -m "Update the public feed cache"
            git push
          fi
