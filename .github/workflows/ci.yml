name: AEGIS SOC CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Tests
        env:
          SOC_MODE: demo
          SOC_DB_PATH: /tmp/aegis-ci.db
        run: python -m pytest -q
      - name: Compile Python
        run: python -m compileall -q app integrations
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build hardened image
        run: docker build -t aegis-soc:test .
