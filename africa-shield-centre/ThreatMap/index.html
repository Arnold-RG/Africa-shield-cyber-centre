<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Africa Shield Centre - Live Threat Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            overflow: hidden;
        }

        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            z-index: 1000;
            border-bottom: 2px solid #ff4444;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo i {
            font-size: 2rem;
            color: #ff4444;
        }

        .logo h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffffff;
        }

        .status-bar {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            font-size: 0.9rem;
        }

        .status-item.active {
            background: rgba(0, 255, 0, 0.2);
            border: 1px solid #00ff00;
        }

        .status-item.critical {
            background: rgba(255, 68, 68, 0.2);
            border: 1px solid #ff4444;
        }

        #map {
            height: 100vh;
            width: 100%;
            background: #0a0a0a;
        }

        .control-panel {
            position: fixed;
            right: 20px;
            top: 100px;
            width: 300px;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            padding: 20px;
            border: 1px solid #333;
            z-index: 1000;
        }

        .control-section {
            margin-bottom: 20px;
        }

        .control-section h3 {
            color: #ff4444;
            margin-bottom: 10px;
            font-size: 1rem;
        }

        .threat-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .filter-btn {
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #555;
            border-radius: 15px;
            color: #fff;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.3s ease;
        }

        .filter-btn.active {
            background: #ff4444;
            border-color: #ff4444;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-number {
            font-size: 1.2rem;
            font-weight: bold;
            color: #ff4444;
        }

        .stat-label {
            font-size: 0.8rem;
            color: #ccc;
        }

        .legend {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #333;
            z-index: 1000;
        }

        .legend h4 {
            color: #ff4444;
            margin-bottom: 10px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.1); }
            100% { opacity: 1; transform: scale(1); }
        }

        .threat-popup {
            background: rgba(0, 0, 0, 0.9);
            color: white;
            border: 1px solid #ff4444;
            border-radius: 8px;
            padding: 0;
        }

        .popup-header {
            background: #ff4444;
            padding: 10px;
            font-weight: bold;
        }

        .popup-content {
            padding: 10px;
        }

        .popup-content p {
            margin: 5px 0;
            font-size: 0.9rem;
        }

        .severity-high { color: #ff4444; }
        .severity-medium { color: #ffaa00; }
        .severity-low { color: #ffff00; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <div class="logo">
                <i class="fas fa-shield-alt"></i>
                <h1>Africa Shield Centre - Live Threat Map</h1>
            </div>
            <div class="status-bar">
                <div class="status-item active">
                    <i class="fas fa-circle"></i>
                    <span>LIVE</span>
                </div>
                <div class="status-item" id="threat-count">
                    <i class="fas fa-exclamation-triangle"></i>
                    <span>0 Active Threats</span>
                </div>
                <div class="status-item" id="last-update">
                    <i class="fas fa-clock"></i>
                    <span>Last Update: --:--</span>
                </div>
            </div>
        </div>
    </div>

    <div id="map"></div>

    <div class="control-panel">
        <div class="control-section">
            <h3><i class="fas fa-filter"></i> Threat Filters</h3>
            <div class="threat-filters">
                <button class="filter-btn active" data-type="all">All</button>
                <button class="filter-btn" data-type="cyber">Cyber</button>
                <button class="filter-btn" data-type="physical">Physical</button>
                <button class="filter-btn" data-type="fraud">Fraud</button>
                <button class="filter-btn" data-type="terrorism">Terrorism</button>
                <button class="filter-btn" data-type="kidnapping">Kidnapping</button>
            </div>
        </div>

        <div class="control-section">
            <h3><i class="fas fa-chart-bar"></i> Live Statistics</h3>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-number" id="total-threats">0</div>
                    <div class="stat-label">Total Threats</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="high-severity">0</div>
                    <div class="stat-label">High Severity</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="countries-affected">0</div>
                    <div class="stat-label">Countries</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="reports-today">0</div>
                    <div class="stat-label">Today</div>
                </div>
            </div>
        </div>
    </div>

    <div class="legend">
        <h4><i class="fas fa-info-circle"></i> Threat Levels</h4>
        <div class="legend-item">
            <div class="legend-color" style="background: #ff4444;"></div>
            <span>High Risk</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #ffaa00;"></div>
            <span>Medium Risk</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #ffff00;"></div>
            <span>Low Risk</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #00ff00;"></div>
            <span>Safe Zone</span>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize map centered on Africa
        const map = L.map('map', {
            center: [0, 20],
            zoom: 4,
            zoomControl: true,
            attributionControl: false
        });

        // Dark tile layer
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '© Africa Shield Centre',
            subdomains: 'abcd',
            maxZoom: 18
        }).addTo(map);

        // Threat markers storage
        let threatMarkers = [];
        let activeFilters = ['all'];

        // Custom icons for different threat types
        const threatIcons = {
            cyber: L.divIcon({
                className: 'custom-div-icon',
                html: '<div style="background: #ff4444; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 12px;"><i class="fas fa-laptop"></i></div>',
                iconSize: [20, 20],
                iconAnchor: [10, 10]
            }),
            physical: L.divIcon({
                className: 'custom-div-icon',
                html: '<div style="background: #ffaa00; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 12px;"><i class="fas fa-fist-raised"></i></div>',
                iconSize: [20, 20],
                iconAnchor: [10, 10]
            }),
            fraud: L.divIcon({
                className: 'custom-div-icon',
                html: '<div style="background: #aa44ff; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 12px;"><i class="fas fa-credit-card"></i></div>',
                iconSize: [20, 20],
                iconAnchor: [10, 10]
            }),
            terrorism: L.divIcon({
                className: 'custom-div-icon',
                html: '<div style="background: #ff0000; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 12px;"><i class="fas fa-bomb"></i></div>',
                iconSize: [20, 20],
                iconAnchor: [10, 10]
            }),
            kidnapping: L.divIcon({
                className: 'custom-div-icon',
                html: '<div style="background: #ff6600; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 12px;"><i class="fas fa-user-times"></i></div>',
                iconSize: [20, 20],
                iconAnchor: [10, 10]
            })
        };

        // Sample threat data (in real implementation, this would come from your database)
        const sampleThreats = [
            { id: 1, lat: 6.5244, lng: 3.3792, type: 'cyber', severity: 'high', title: 'Banking Malware Attack', description: 'Sophisticated malware targeting banking systems in Lagos', country: 'Nigeria', timestamp: new Date() },
            { id: 2, lat: -1.2921, lng: 36.8219, type: 'fraud', severity: 'medium', title: 'Mobile Money Fraud', description: 'Increased mobile money fraud reports', country: 'Kenya', timestamp: new Date() },
            { id: 3, lat: 9.0579, lng: 7.4951, type: 'kidnapping', severity: 'high', title: 'Kidnapping Alert', description: 'Multiple kidnapping incidents reported', country: 'Nigeria', timestamp: new Date() },
            { id: 4, lat: -26.2041, lng: 28.0473, type: 'cyber', severity: 'medium', title: 'Ransomware Attack', description: 'Corporate networks under ransomware attack', country: 'South Africa', timestamp: new Date() },
            { id: 5, lat: 5.6037, lng: -0.1870, type: 'fraud', severity: 'low', title: 'Online Scam', description: 'Romance scam targeting social media users', country: 'Ghana', timestamp: new Date() },
            { id: 6, lat: 15.5007, lng: 32.5599, type: 'physical', severity: 'high', title: 'Civil Unrest', description: 'Protests and civil unrest reported', country: 'Sudan', timestamp: new Date() },
            { id: 7, lat: -15.3875, lng: 28.3228, type: 'cyber', severity: 'medium', title: 'Data Breach', description: 'Government database compromised', country: 'Zambia', timestamp: new Date() },
            { id: 8, lat: 7.9465, lng: -1.0232, type: 'fraud', severity: 'high', title: 'Investment Scam', description: 'Ponzi scheme affecting thousands', country: 'Ghana', timestamp: new Date() },
            { id: 9, lat: -4.0383, lng: 21.7587, type: 'terrorism', severity: 'high', title: 'Terror Threat', description: 'Credible terrorist threat intelligence', country: 'DRC', timestamp: new Date() },
            { id: 10, lat: 33.8869, lng: 9.5375, type: 'cyber', severity: 'low', title: 'Phishing Campaign', description: 'Email phishing targeting businesses', country: 'Tunisia', timestamp: new Date() }
        ];

        // Add threats to map
        function addThreatToMap(threat) {
            const marker = L.marker([threat.lat, threat.lng], {
                icon: threatIcons[threat.type]
            }).addTo(map);

            // Create popup content
            const popupContent = `
                <div class="threat-popup">
                    <div class="popup-header">
                        ${threat.title}
                    </div>
                    <div class="popup-content">
                        <p><strong>Type:</strong> ${threat.type.charAt(0).toUpperCase() + threat.type.slice(1)}</p>
                        <p><strong>Severity:</strong> <span class="severity-${threat.severity}">${threat.severity.toUpperCase()}</span></p>
                        <p><strong>Location:</strong> ${threat.country}</p>
                        <p><strong>Description:</strong> ${threat.description}</p>
                        <p><strong>Time:</strong> ${threat.timestamp.toLocaleString()}</p>
                    </div>
                </div>
            `;

            marker.bindPopup(popupContent);
            marker.threatData = threat;
            threatMarkers.push(marker);

            // Add pulse animation for high severity threats
            if (threat.severity === 'high') {
                marker.getElement().classList.add('pulse');
            }
        }

        // Load initial threats
        function loadThreats() {
            sampleThreats.forEach(threat => {
                addThreatToMap(threat);
            });
            updateStatistics();
        }

        // Filter threats
        function filterThreats() {
            threatMarkers.forEach(marker => {
                const threat = marker.threatData;
                const shouldShow = activeFilters.includes('all') || activeFilters.includes(threat.type);
                
                if (shouldShow) {
                    marker.addTo(map);
                } else {
                    map.removeLayer(marker);
                }
            });
        }

        // Update statistics
        function updateStatistics() {
            const visibleThreats = threatMarkers.filter(marker => 
                activeFilters.includes('all') || activeFilters.includes(marker.threatData.type)
            );

            const totalThreats = visibleThreats.length;
            const highSeverity = visibleThreats.filter(m => m.threatData.severity === 'high').length;
            const countries = new Set(visibleThreats.map(m => m.threatData.country)).size;
            const today = new Date().toDateString();
            const reportsToday = visibleThreats.filter(m => 
                m.threatData.timestamp.toDateString() === today
            ).length;

            document.getElementById('total-threats').textContent = totalThreats;
            document.getElementById('high-severity').textContent = highSeverity;
            document.getElementById('countries-affected').textContent = countries;
            document.getElementById('reports-today').textContent = reportsToday;
            document.getElementById('threat-count').innerHTML = `
                <i class="fas fa-exclamation-triangle"></i>
                <span>${totalThreats} Active Threats</span>
            `;
        }

        // Update timestamp
        function updateTimestamp() {
            const now = new Date();
            document.getElementById('last-update').innerHTML = `
                <i class="fas fa-clock"></i>
                <span>Last Update: ${now.toLocaleTimeString()}</span>
            `;
        }

        // Filter button event listeners
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const filterType = this.dataset.type;
                
                if (filterType === 'all') {
                    // If "All" is clicked, deactivate other filters
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    activeFilters = ['all'];
                } else {
                    // Remove "All" filter if specific filter is selected
                    document.querySelector('.filter-btn[data-type="all"]').classList.remove('active');
                    
                    if (this.classList.contains('active')) {
                        // Deactivate filter
                        this.classList.remove('active');
                        activeFilters = activeFilters.filter(f => f !== filterType);
                        
                        // If no filters active, activate "All"
                        if (activeFilters.length === 0) {
                            document.querySelector('.filter-btn[data-type="all"]').classList.add('active');
                            activeFilters = ['all'];
                        }
                    } else {
                        // Activate filter
                        this.classList.add('active');
                        if (activeFilters.includes('all')) {
                            activeFilters = [filterType];
                        } else {
                            activeFilters.push(filterType);
                        }
                    }
                }
                
                filterThreats();
                updateStatistics();
            });
        });

        // Simulate real-time updates
        function simulateRealTimeUpdates() {
            setInterval(() => {
                // Randomly add new threats (simulation)
                if (Math.random() < 0.1) { // 10% chance every 5 seconds
                    const threatTypes = ['cyber', 'physical', 'fraud', 'terrorism', 'kidnapping'];
                    const severities = ['low', 'medium', 'high'];
                    const countries = ['Nigeria', 'Kenya', 'South Africa', 'Ghana', 'Egypt', 'Morocco', 'Ethiopia'];
                    
                    const newThreat = {
                        id: Date.now(),
                        lat: (Math.random() * 60) - 30, // Africa latitude range
                        lng: (Math.random() * 60) - 10, // Africa longitude range
                        type: threatTypes[Math.floor(Math.random() * threatTypes.length)],
                        severity: severities[Math.floor(Math.random() * severities.length)],
                        title: 'New Threat Detected',
                        description: 'Real-time threat detection system alert',
                        country: countries[Math.floor(Math.random() * countries.length)],
                        timestamp: new Date()
                    };
                    
                    addThreatToMap(newThreat);
                    filterThreats();
                    updateStatistics();
                }
                
                updateTimestamp();
            }, 5000); // Update every 5 seconds
        }

        // Add heat zones for high-risk areas
        function addHeatZones() {
            // Nigeria - High cyber crime area
            L.circle([9.0820, 8.6753], {
                color: '#ff4444',
                fillColor: '#ff4444',
                fillOpacity: 0.1,
                radius: 200000,
                weight: 2,
                dashArray: '5, 5'
            }).addTo(map).bindPopup('<b>High Risk Zone</b><br>Elevated cyber crime activity');

            // Somalia - High terrorism risk
            L.circle([5.1521, 46.1996], {
                color: '#ff0000',
                fillColor: '#ff0000',
                fillOpacity: 0.15,
                radius: 300000,
                weight: 2,
                dashArray: '5, 5'
            }).addTo(map).bindPopup('<b>Critical Risk Zone</b><br>High terrorism threat level');

            // South Africa - Fraud hotspot
            L.circle([-25.7479, 28.2293], {
                color: '#aa44ff',
                fillColor: '#aa44ff',
                fillOpacity: 0.1,
                radius: 150000,
                weight: 2,
                dashArray: '5, 5'
            }).addTo(map).bindPopup('<b>Fraud Hotspot</b><br>High financial crime activity');
        }

        // Add country borders highlight for affected countries
        function highlightAffectedCountries() {
            // This would typically load GeoJSON data for country borders
            // For now, we'll add some sample country highlights
            const affectedCountries = [
                { name: 'Nigeria', coords: [[4.2, 2.7], [14.0, 14.6]] },
                { name: 'Kenya', coords: [[-4.7, 33.9], [5.0, 41.9]] },
                { name: 'South Africa', coords: [[-35.0, 16.3], [-22.1, 32.9]] }
            ];

            affectedCountries.forEach(country => {
                L.rectangle(country.coords, {
                    color: '#ffaa00',
                    weight: 2,
                    fillOpacity: 0.05,
                    dashArray: '10, 5'
                }).addTo(map).bindPopup(`<b>${country.name}</b><br>Active threat monitoring`);
            });
        }

        // Initialize everything
        function init() {
            loadThreats();
            addHeatZones();
            highlightAffectedCountries();
            updateTimestamp();
            simulateRealTimeUpdates();
            
            // Set initial statistics
            updateStatistics();
        }

        // Start the application
        init();

        // Add custom CSS for marker animations
        const style = document.createElement('style');
        style.textContent = `
            .custom-div-icon {
                background: transparent !important;
                border: none !important;
            }
            
            .leaflet-popup-content-wrapper {
                background: rgba(0, 0, 0, 0.9) !important;
                color: white !important;
                border-radius: 8px !important;
                border: 1px solid #ff4444 !important;
            }
            
            .leaflet-popup-tip {
                background: rgba(0, 0, 0, 0.9) !important;
                border: 1px solid #ff4444 !important;
            }
            
            .leaflet-control-zoom {
                background: rgba(0, 0, 0, 0.8) !important;
                border: 1px solid #333 !important;
            }
            
            .leaflet-control-zoom a {
                background: rgba(0, 0, 0, 0.8) !important;
                color: white !important;
                border: 1px solid #555 !important;
            }
            
            .leaflet-control-zoom a:hover {
                background: rgba(255, 68, 68, 0.8) !important;
            }
        `;
        document.head.appendChild(style);

        // Add keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            switch(e.key) {
                case '1':
                    document.querySelector('.filter-btn[data-type="all"]').click();
                    break;
                case '2':
                    document.querySelector('.filter-btn[data-type="cyber"]').click();
                    break;
                case '3':
                    document.querySelector('.filter-btn[data-type="physical"]').click();
                    break;
                case '4':
                    document.querySelector('.filter-btn[data-type="fraud"]').click();
                    break;
                case '5':
                    document.querySelector('.filter-btn[data-type="terrorism"]').click();
                    break;
                case '6':
                    document.querySelector('.filter-btn[data-type="kidnapping"]').click();
                    break;
                case 'r':
                case 'R':
                    location.reload();
                    break;
            }
        });

        // Add fullscreen toggle
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F11') {
                e.preventDefault();
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen();
                } else {
                    document.exitFullscreen();
                }
            }
        });

        console.log('Africa Shield Centre - Live Threat Map Initialized');
        console.log('Keyboard shortcuts: 1-6 for filters, R for refresh, F11 for fullscreen');
    </script>
</body>
</html>
